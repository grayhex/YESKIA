# Opt-in, one-shot system helper. No Bluetooth listener, no autostart, no phone UI.
NAME=yeskiaagent
VENDOR="YESKIA"
VERSION=0,1,0
# Provisional development UID; replace with a registered UID for distribution.
UID3=0xE0AA00F3
USE_SHIM=0
