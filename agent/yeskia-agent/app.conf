HEADLESS=1
RUST_CRATE=device
CXX_SOURCES="src/registry.cpp"
SYMBIAN_LIBS="euser efsrv estor hal apgrfx apparc"
USE_MEM=1
CAPABILITIES="ReadUserData WriteUserData"
HEAP=0x1000,0x100000
STACK=0x8000
DEBUG=0
SIGN=0
