name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p yeskia-core --all-targets -- -D warnings
      - run: cargo test -p yeskia-core

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:lint
      - run: npm --workspace ui run format:check
      - run: npm run ui:test
      - run: npm run ui:build

  windows-app:
    name: Windows app build + smoke
    runs-on: windows-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - name: Build Tauri shell
        run: cargo build -p yeskia-app --release
      - name: Smoke test (старт без окна)
        shell: bash
        env:
          YESKIA_DATA_DIR: ${{ runner.temp }}/yeskia-smoke
        run: |
          out=$(./target/release/yeskia-app.exe --smoke-test)
          echo "$out"
          echo "$out" | grep -q '"mock_identify":"ok"'
          echo "$out" | grep -q '"storage_ok":true'
