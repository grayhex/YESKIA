name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p yeskia-core -p yeskia-discovery -p yeskia-lab -p yeskia-adbian -p yeskia-agent-protocol --all-targets -- -D warnings
      - run: cargo test -p yeskia-core -p yeskia-discovery -p yeskia-lab -p yeskia-adbian -p yeskia-agent-protocol
      - name: Лаборатория — приватность и сырые трассы
        run: cargo run -q -p yeskia-lab -- scan .

  ui:
    name: UI (TypeScript)
    # This hosted image includes Chrome; do not depend on ubuntu-latest rollovers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:lint
      - run: npm --workspace ui run format:check
      - run: npm run ui:test
      - run: npm run ui:build
      - name: Use hosted Chrome for layout regression checks
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome)"
          "$chrome_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: npm run ui:layout
      - name: Layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YESKIA-Layout-Report
          path: docs/screenshots/fluent/layout-report.json
      - name: Скрипты релиза (уведомления, SBOM, контрольные суммы)
        run: npm run release:test

  windows-app:
    name: Windows app build + smoke
    needs: [core, ui]
    uses: ./.github/workflows/release.yml
