name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg для smoke-тестов медиа (внешний инструмент)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg для smoke-тестов медиа (внешний инструмент)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: cargo fmt --all --check
      - run: cargo clippy -p yeskia-core -p yeskia-discovery -p yeskia-lab --all-targets -- -D warnings
      - run: cargo test -p yeskia-core -p yeskia-discovery -p yeskia-lab
        env:
          # без FFmpeg тесты медиа не пропускаются, а падают
          YESKIA_REQUIRE_FFMPEG: "1"
      - name: Лаборатория — приватность и сырые трассы
        run: cargo run -q -p yeskia-lab -- scan .

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_personal_reader.py
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:lint
      - run: npm --workspace ui run format:check
      - run: npm run ui:test
      - run: npm run ui:build
      - name: Скрипты релиза (уведомления, SBOM, контрольные суммы)
        run: node --test scripts/release.test.mjs

  windows-app:
    name: Windows app build + smoke
    runs-on: windows-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - name: Build Tauri shell
        run: cargo build -p yeskia-app --release
      - name: Smoke test (старт без окна)
        shell: bash
        env:
          YESKIA_DATA_DIR: ${{ runner.temp }}/yeskia-smoke
        run: |
          out=$(./target/release/yeskia-app.exe --smoke-test)
          echo "$out"
          echo "$out" | grep -q '"mock_identify":"ok"'
          echo "$out" | grep -q '"storage_ok":true'
      - name: Doctor (read-only, без телефона)
        shell: bash
        env:
          YESKIA_DATA_DIR: ${{ runner.temp }}/yeskia-smoke
        run: |
          out=$(./target/release/yeskia-app.exe --doctor)
          echo "$out"
          echo "$out" | grep -q '"schema": 1'
          echo "$out" | grep -q '"os": "Windows'
          # privacy: в отчёте нет путей/instance id
          ! echo "$out" | grep -qiE 'usb\\\\vid_|\\\\\\\\\?\\\\'
      - name: Лаборатория — inventory на Windows (без телефона)
        shell: bash
        run: |
          out=$(cargo run -q -p yeskia-lab -- inventory)
          echo "$out" | grep -q '"schema": "yeskia.lab.report/1"'
          ! echo "$out" | grep -qiE 'usb\\\\vid_|\\\\\\\\\?\\\\'
      - name: Нет сетевых клиентов и серверов в сборке приложения
        shell: bash
        run: |
          tree=$(cargo tree --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -e normal --prefix none)
          if echo "$tree" | grep -iE '^(reqwest|hyper|hyper-util|ureq|isahc|curl|attohttpc|surf|awc|actix-web|axum|warp|tiny_http|rouille) '; then
            echo "В сборке приложения найден HTTP-клиент или сервер"; exit 1
          fi
          # CSP: только IPC, без внешних адресов
          ! grep -E 'connect-src[^"]*https?://[^i"]' src-tauri/tauri.conf.json
      - name: Установщик, портативная сборка, уведомления, SBOM, контрольные суммы
        shell: bash
        run: bash scripts/package.sh
      - name: Проверка артефактов без телефона (чистая Windows без Rust/Node/Python — смотрите docs/DISTRIBUTION.md)
        shell: bash
        run: |
          cd dist-release
          sha256sum -c SHA256SUMS.txt
          powershell.exe -NoProfile -Command "Expand-Archive -Path (Get-ChildItem 'YESKIA_*_x64-portable.zip').FullName -DestinationPath portable-check -Force"
          env -u YESKIA_DATA_DIR ./portable-check/YESKIA/YESKIA.exe --smoke-test | grep -q '"storage_ok":true'
          test -d portable-check/YESKIA/data
          # портативный режим не пишет в профиль пользователя
          rm -rf portable-check
          grep -q 'не подписана' RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: yeskia-windows-unsigned
          path: dist-release/
          if-no-files-found: error
          retention-days: 7
