name: Release artifacts

# Только ручной запуск владельцем. Сборка НИЧЕГО не публикует: артефакты остаются во вкладке запуска,
# GitHub Release создаёт владелец вручную после проверки (и ручной проверки на устройстве).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - name: Сборка артефактов
        shell: bash
        run: bash scripts/package.sh
      - name: Установка, повторная установка и сохранение данных
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YESKIA-Windows-Installer
          path: dist-release/*-setup.exe
          if-no-files-found: error
          retention-days: 30
