[workspace]
resolver = "2"
members = ["crates/yeskia-core", "src-tauri"]
# src-tauri требует системных библиотек WebView (Windows: WebView2), поэтому
# обычные `cargo build/test` собирают только ядро. Оболочку собирает `npm run tauri`.
default-members = ["crates/yeskia-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
